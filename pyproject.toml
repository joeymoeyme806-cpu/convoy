[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convoy"
version = "0.1.0"
description = "Pack your entire Python project into a single .convoy file"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
convoy = "convoy.cli:main"
convoy-settings = "convoy.settings:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["convoy*"]
